# Render Blueprint: creates the API web service and its PostgreSQL database.
databases:
  - name: ludo-db
    plan: free
    databaseName: ludo

services:
  - type: web
    name: ludo-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-db
          property: connectionString
      - key: GOOGLE_CLIENT_IDS
        sync: false # Google OAuth client IDs (web, and Android for the app), comma separated
      - key: JWT_SECRET
        sync: false # long random string; must be identical on ludo-game-server
      - key: ADMIN_API_KEY
        generateValue: true
      # Must be the same value as INTERNAL_API_KEY on ludo-game-server. Enter it when prompted.
      - key: INTERNAL_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
